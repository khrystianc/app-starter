# The "load plan" for the dev workbench: one Python container to code in,
# plus a Postgres database. Works the same in Codespaces and local Docker.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ..:/workspaces/app:cached              # your repo, shared with the editor
      - claude-config:/home/vscode/.claude     # Claude Code settings survive rebuilds
    environment:
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      DATABASE_URL: postgresql://postgres:postgres@db:5432/appdb
    command: sleep infinity                    # keep the container running
    depends_on: [db]

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres              # local/dev only, never production
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  claude-config:
  pgdata:
