# Render Blueprint: Render reads this when you click New -> Blueprint.
# Replace APP_NAME everywhere. Delete the `databases` block and the
# DATABASE_URL entry if the app doesn't need a database.
services:
  - type: web
    name: APP_NAME
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /health
    autoDeployTrigger: checksPass        # deploy only after GitHub Actions passes
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: APP_NAME-db
          property: connectionString
      - key: ANTHROPIC_API_KEY           # Render asks for the value on first setup
        sync: false

databases:
  - name: APP_NAME-db
    plan: free                           # free Postgres expires after 30 days
